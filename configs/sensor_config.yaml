carla:
  host: localhost
  port: 2000
  timeout: 10.0
  map: Town03
  quality: Low
  tm_port: 10000
  resolution:
    width: 640
    height: 360

sensors:
  rgb_camera:
    blueprint: sensor.camera.rgb
    transform: {x: 1.5, y: 0.0, z: 2.4, pitch: 0.0, yaw: 0.0, roll: 0.0}
    attributes:
      image_size_x: 640
      image_size_y: 360
      fov: 110
      sensor_tick: 0.1

  semantic_camera:
    blueprint: sensor.camera.semantic_segmentation
    transform: {x: 1.5, y: 0.0, z: 2.4, pitch: 0.0, yaw: 0.0, roll: 0.0}
    attributes:
      image_size_x: 640
      image_size_y: 360
      fov: 110
      sensor_tick: 0.1

  lidar:
    blueprint: sensor.lidar.ray_cast
    transform: {x: 0.0, y: 0.0, z: 2.5, pitch: 0.0, yaw: 0.0, roll: 0.0}
    attributes:
      channels: 32
      points_per_second: 200000
      rotation_frequency: 10
      range: 100
      upper_fov: 10
      lower_fov: -30
      sensor_tick: 0.1

recording:
  num_frames: 1000
  output_dir: data/raw/recording_001
  traffic_vehicles: 5
  traffic_walkers: 0
  use_synchronous_mode: true
  fixed_delta_seconds: 0.1
  warmup_ticks: 5
  sensor_timeout: 5.0
  native_recorder: false
